name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the release commit belongs to main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify release version
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as manifest:
              version = tomllib.load(manifest)["project"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Release version must be x.y.z")
          if os.environ["RELEASE_EVENT"] == "push" and os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Tag must match the version in pyproject.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.7'
      - name: Test source
        run: make test
      - name: Build native archive
        run: sh scripts/build-release.sh
      - name: Test packaged executable
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/ub_${RELEASE_VERSION}_${RELEASE_OS}_${RELEASE_ARCH}.tar.gz"
          mkdir "$RUNNER_TEMP/ub-smoke"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ub-smoke" ub
          sh scripts/smoke-release.sh "$RUNNER_TEMP/ub-smoke/ub"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ub-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/ub_${{ needs.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ub-*
          merge-multiple: true
          path: dist
      - name: Assemble release assets
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            test -f "dist/ub_${RELEASE_VERSION}_${platform}.tar.gz"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum ub_*.tar.gz install.sh > checksums.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ub-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Create or update draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true || {
              echo "Release $tag is already published; assets will not be replaced." >&2
              exit 1
            }
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --draft \
              --title "ub $tag" --generate-notes
          fi
