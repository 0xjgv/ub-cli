name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.7'
      # Same step as release.yml's version job; keep the two in sync.
      - name: Check that vendored engines match their pins
        run: |
          python scripts/vendor.py
          test -z "$(git status --porcelain -- src/ub_cli/vendor)" || {
            git status --short -- src/ub_cli/vendor
            echo "src/ub_cli/vendor differs from scripts/vendor.py output; never edit it by hand." >&2
            exit 1
          }
      - name: Test source
        run: make test
