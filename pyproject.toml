[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ub-cli"
version = "0.3.2"
description = "Run the three ub-mode quality checks from one CLI"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "src/ub_cli/vendor/*/LICENSE"]
requires-python = ">=3.11"
keywords = [
    "cli",
    "code-quality",
    "mutation-testing",
    "crap-metric",
    "code-duplication",
    "test-coverage",
    "static-analysis",
    "quality-gate",
    "ub-mode",
    "python",
]
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.22.1",
]

[project.scripts]
ub = "ub_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ub_cli = ["install.sh", "skills/ub-mode/SKILL.md", "skills/ub-mode/LICENSE"]
